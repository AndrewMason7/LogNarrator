[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "log-narrator"
version = "0.1.0"
description = "Autonomous real-time log translator, diagnostic copilot, and incident narrator powered by Google Antigravity SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-antigravity>=0.1.18",
    "rich>=13.7.0",
    "click>=8.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "aiofiles>=23.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
log-narrator = "log_narrator.cli:main"
narrator = "log_narrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/log_narrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:CapabilitiesConfig.compaction_threshold is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]
ignore = ["B008", "E501"]

